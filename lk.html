<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Болашақ 140 балл иегері</title>
  <style>
    import url('https://fonts.googleapis.com/css2?family=MV+Boli&display=swap');

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: system-ui, sans-serif;
    }

    .envelope {
      width: 600px;
      height: 400px;
      position: relative;
      cursor: pointer;
      perspective: 1000px;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      border-radius: 16px;
      transform-origin: top;
      transition: transform 0.8s ease;
      z-index: 3;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .content {
      position: absolute;
      inset: 12px;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transform: translateY(40px);
      opacity: 0;
      transition: all 0.8s ease;
      z-index: 2;
      overflow: hidden; /* обрезаем всё, что выходит */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .envelope.open .content {
      transform: translateY(-20px);
      opacity: 1;
    }

    .content img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .text {
      font-size: 15px;
      line-height: 1.3;
      font-family: 'MV Boli', cursive;
      overflow-wrap: break-word;
      word-break: break-word;
      max-height: 120px;
      overflow: hidden;
    }

    .base {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      z-index: 4;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .envelope.open .base {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="content">
      <img src="https://postimage.me/images/2026/01/21/photo.jpg" alt="Ваше фото">
      <div class="text">
        You can do everything, I believe in you, good luck!💙
      </div>
    </div>
    <div class="base">Нажми, чтобы открыть ✉️</div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
    });
  </script>
</body>
</html>
